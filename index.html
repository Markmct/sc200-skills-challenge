*{box-sizing:border-box}body{margin:0;background:#0c1525;color:#e8edf7;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:32px auto;padding:24px}h1{font-size:32px;line-height:1.15;margin:8px 0}h2{font-size:23px;line-height:1.3}.eyebrow{color:#81c7ff;font-size:12px;letter-spacing:2px;font-weight:bold}.muted,small{color:#a5b4ca}.panel{background:#162238;border:1px solid #30425d;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .panel{margin:0}.num{font-size:26px;font-weight:bold}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.bar{height:9px;border-radius:10px;background:#2b3d54;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#56adff}label{display:block;margin:15px 0 5px}input,select,textarea,button{font:inherit;color:inherit;border:1px solid #48617d;border-radius:7px;padding:10px;background:#101b2d}input,select,textarea{width:100%}textarea{min-height:180px;font-family:monospace}button{cursor:pointer;background:#20344d}button:hover{background:#315576}button:disabled{opacity:.4;cursor:default}.primary{background:#1968be;font-weight:bold;width:100%;margin-top:18px}.tile{display:flex;align-items:center;gap:10px;border:1px solid #435673;background:#19283e;padding:10px;border-radius:8px;margin:8px 0}.tile span{flex:1}.tile button{padding:4px 12px}pre{background:#080f1c;padding:15px;border-radius:8px;color:#b5d9ff;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #34445a}.ok{color:#65d6ab}.bad{color:#f7b77c}.score{font-size:44px;color:#81c7ff;font-weight:bold}footer{margin-top:24px;color:#a5b4ca;font-size:12px}summary{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #81c7ff;outline-offset:2px}@media(max-width:500px){main{margin:0;padding:16px}.tile{gap:5px}.tile button{padding:4px 8px}h1{font-size:26px}}

const questions=[{"cat":"Security automation","title":"Configure an automated response","prompt":"Arrange the steps for deploying and validating a new incident-triggered Sentinel playbook.","type":"order","items":["Configure an automation rule to invoke the playbook","Create the Logic App with the Sentinel incident trigger","Generate a test incident and verify execution","Grant Sentinel permission to execute the playbook"],"answer":[1,3,0,2],"why":"Create the Logic App, grant execution permissions, link it to an automation rule, then test."},{"cat":"KQL","title":"Detect repeated failed sign-ins","prompt":"Find users with more than 10 unsuccessful sign-ins in the last hour.","type":"select","code":"SigninLogs\n| [1] TimeGenerated > ago(1h)\n| where [2] != \"0\"\n| [3] Failures = count() by UserPrincipalName\n| where Failures [4] 10","items":["Blank 1","Blank 2","Blank 3","Blank 4"],"options":[["where","project","extend","join"],["IPAddress","UserPrincipalName","ResultType","Location"],["extend","summarize","distinct","project"],[">=","\u003c","==",">"]],"answer":["where","ResultType","summarize",">"],"why":"Filter by time and result before aggregating; apply the threshold afterwards. Non-zero result codes may include interrupted sign-ins."},{"cat":"Defender XDR","title":"Choose the right security capability","prompt":"Match each requirement to a product.","type":"select","items":["Correlate third-party firewall logs","Investigate endpoint process execution","Detect suspicious on-premises Active Directory activity","Investigate malicious email attachments","Investigate suspicious OAuth application activity"],"options":["Defender for Office 365","Defender for Endpoint","Defender for Identity","Defender for Cloud Apps","Microsoft Sentinel"],"answer":["Microsoft Sentinel","Defender for Endpoint","Defender for Identity","Defender for Office 365","Defender for Cloud Apps"],"why":"Sentinel correlates data across sources; Defender products specialise in endpoint, identity, email and cloud application security."},{"cat":"KQL","title":"Debug the detection query","prompt":"Correct three errors to identify computers generating more than five process creation events in 24 hours.","type":"debug","code":"SecurityEvent\n| where TimeGenerated > ago(24)\n| where EventID == 4624\n| project Total = count() by Computer\n| where Total > 5","answer":"SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID == 4688\n| summarize Total = count() by Computer\n| where Total > 5","marks":3,"why":"Use a valid timespan, event 4688 and summarize for aggregation."},{"cat":"Incident investigation","title":"Investigate suspicious authentication","prompt":"Interpret this fictional sign-in evidence.","type":"select","table":[["09:01","Alice","203.0.113.10","Failed"],["09:02","Bob","203.0.113.10","Failed"],["09:03","Charlie","203.0.113.10","Failed"],["09:04","David","203.0.113.10","Failed"],["09:05","Alice","203.0.113.10","Failed"],["09:06","Bob","203.0.113.10","Success"]],"items":["Likely attack pattern","Account to prioritise","Evidence needed next","If compromise is confirmed"],"options":[["Password spraying","Ransomware","Data destruction"],["Alice","Bob","Charlie","David"],["Sign-in context and subsequent activity","Storage account configuration","Retention label inventory"],["Revoke sessions and reset credentials","Delete audit logs","Ignore the successful sign-in"]],"answer":["Password spraying","Bob","Sign-in context and subsequent activity","Revoke sessions and reset credentials"],"why":"Multiple accounts share a suspicious source IP and one subsequently authenticates. Investigate Bob, but the pattern alone is not proof of compromise."},{"cat":"KQL","title":"Debug an advanced hunting query","prompt":"Correct five errors in this query to find PowerShell executions in the last 24 hours, newest first.","type":"select","items":["Replace DeviceInfo","Replace TimeGenerated","Replace DeviceName in filter","Replace summarize","Replace asc"],"options":[["DeviceInfo","DeviceProcessEvents","DeviceNetworkEvents"],["TimeGenerated","Timestamp","ReportId"],["DeviceName","FileName","AccountName"],["summarize","project","extend"],["asc","desc"]],"answer":["DeviceProcessEvents","Timestamp","FileName","project","desc"],"why":"Process telemetry uses Timestamp and FileName. Project selects fields; descending sort puts newest first.","code":"[1]\n| where [2] > ago(24h)\n| where [3] =~ \"powershell.exe\"\n| [4] DeviceName, AccountName, Timestamp, ProcessCommandLine\n| order by Timestamp [5]"},{"cat":"Incident investigation","title":"Respond to confirmed endpoint compromise","prompt":"Arrange the activities according to this SOC procedure: validation, containment, remediation, verified recovery.","type":"order","items":["Verify the device is clean and release isolation","Remove malicious files and remediate persistence","Validate the alert and confirm the affected device","Isolate the compromised device"],"answer":[2,3,1,0],"why":"Validate, contain, eradicate and recover. Real incidents may have overlapping actions and require evidence preservation."},{"cat":"Sentinel configuration","title":"Configure Microsoft Sentinel","prompt":"Match requirements to Sentinel capabilities.","type":"select","items":["Import supported event data","Turn matching KQL results into alerts","Automatically invoke a response workflow","Associate query results with a host or account"],"options":["Automation rule","Data connector","Entity mapping","Analytics rule"],"answer":["Data connector","Analytics rule","Automation rule","Entity mapping"],"why":"Connectors ingest, analytics rules detect, automation rules orchestrate and entity mapping adds context."},{"cat":"ASIM and normalisation","title":"Hunt across normalised sources","prompt":"Complete a query using the available built-in registry parser to retrieve up to 100 events from the last day.","type":"select","code":"[1]()\n| [2] TimeGenerated > ago(1d)\n| [3] 100","items":["Blank 1","Blank 2","Blank 3"],"options":[["SecurityEvent","_Im_RegistryEvent","DeviceInfo"],["extend","project","where"],["count","take","join"]],"answer":["_Im_RegistryEvent","where","take"],"why":"The unifying ASIM parser exposes a common registry event schema across supported sources."},{"cat":"Cross-platform investigation","title":"SOC simulation: Compromised employee","prompt":"Review Contoso’s fictional incident timeline and select an evidence-led response.","type":"select","timeline":["08:45 — Phishing email delivered to Sarah.","09:02 — Successful sign-in from unfamiliar location.","09:15 — Unusual volume of cloud file downloads.","09:22 — Suspicious PowerShell activity on her laptop."],"items":["Verify authentication activity","Retrieve endpoint process evidence","Contain confirmed endpoint compromise","Reduce risk from stolen active sessions","Automate disruptive actions responsibly"],"options":[["Entra ID SigninLogs","Sensitivity label policy","Azure billing logs"],["DeviceProcessEvents","EmailEvents only","Azure resource tags"],["Isolate the device","Delete the incident","Disable logging"],["Revoke active sessions","Change incident title","Create a workbook"],["Use scoped playbook with approval where appropriate","Wipe every device automatically","Disable detection rules"]],"answer":["Entra ID SigninLogs","DeviceProcessEvents","Isolate the device","Revoke active sessions","Use scoped playbook with approval where appropriate"],"why":"Correlate identity, email, cloud and endpoint signals. Scope response and use approval where necessary."},{"cat":"KQL","title":"String operators","prompt":"Match the matching requirements to KQL operators.","type":"select","items":["Case-sensitive equality","Case-insensitive equality","Whole term","Substring"],"options":["==","=~","contains","has"],"answer":["==","=~","has","contains"],"why":"Equality, term matching and substring matching differ."},{"cat":"KQL","title":"Order an aggregation pipeline","prompt":"Find users with more than five sign-in events in the last hour.","type":"order","items":["| where Total > 5","SigninLogs","| summarize Total=count() by UserPrincipalName","| where TimeGenerated > ago(1h)"],"answer":[1,3,2,0],"why":"Filter events before aggregation, then filter the aggregate."},{"cat":"Sentinel configuration","title":"Sentinel permissions","prompt":"Match least-privilege roles to tasks, assuming other prerequisites are satisfied.","type":"select","items":["View data","Manage incidents","Configure analytics rules","Grant Sentinel service permission to run playbooks"],"options":["Microsoft Sentinel Responder","Microsoft Sentinel Contributor","Microsoft Sentinel Automation Contributor","Microsoft Sentinel Reader"],"answer":["Microsoft Sentinel Reader","Microsoft Sentinel Responder","Microsoft Sentinel Contributor","Microsoft Sentinel Automation Contributor"],"why":"Reader views, Responder manages incidents, Contributor configures, Automation Contributor enables service execution."},{"cat":"Defender XDR","title":"Hunting tables","prompt":"Match the evidence to its table.","type":"select","items":["Process execution","Network connection","File creation","Registry modification"],"options":["DeviceFileEvents","DeviceProcessEvents","DeviceNetworkEvents","DeviceRegistryEvents"],"answer":["DeviceProcessEvents","DeviceNetworkEvents","DeviceFileEvents","DeviceRegistryEvents"],"why":"Endpoint tables are organised by activity."},{"cat":"KQL","title":"Time-binned query","prompt":"Count events per computer in 15-minute buckets.","type":"select","items":["Operator","Aggregate","Time function"],"options":[["project","summarize","extend"],["dcount()","count()","sum()"],["ago","bin","now"]],"answer":["summarize","count()","bin"],"why":"bin groups timestamps into intervals.","code":"SecurityEvent\n| where TimeGenerated > ago(1d)\n| [1] Total=[2] by Computer, [3](TimeGenerated, 15m)"},{"cat":"Incident investigation","title":"Investigate phishing","prompt":"Follow the specified workflow: validate, scope, remediate, document.","type":"order","items":["Record findings and closure","Identify other recipients","Review sender and attachment evidence","Remediate confirmed malicious mail"],"answer":[2,1,3,0],"why":"Validate and scope before targeted remediation."},{"cat":"KQL","title":"Join behaviour","prompt":"Match join kinds to output.","type":"select","items":["All left rows with nulls for unmatched right values","Matching rows from both sides","Left rows with no matching right row"],"options":["leftouter","leftanti","inner"],"answer":["leftouter","inner","leftanti"],"why":"Join kinds control unmatched rows."},{"cat":"Security automation","title":"Automation components","prompt":"Match each responsibility.","type":"select","items":["Decide when to invoke workflow","Perform API calls and notification","Authenticate supported Azure connections"],"options":["Managed identity","Automation rule","Logic App playbook"],"answer":["Automation rule","Logic App playbook","Managed identity"],"why":"Rules trigger, playbooks act, identities authenticate."},{"cat":"Incident investigation","title":"Endpoint evidence","prompt":"An unknown executable spawns PowerShell and makes an outbound connection. Match investigation tasks.","type":"select","items":["Trace process relationships","Find destination IP and port","Check file hash and prevalence"],"options":[["DeviceProcessEvents","SigninLogs","EmailEvents"],["DeviceNetworkEvents","DeviceInfo","IdentityInfo"],["File evidence and hunting telemetry","Azure billing","Retention policies"]],"answer":["DeviceProcessEvents","DeviceNetworkEvents","File evidence and hunting telemetry"],"why":"Correlate process, network and file evidence."},{"cat":"ASIM and normalisation","title":"Normalisation concepts","prompt":"Match each concept.","type":"select","items":["Unifying parser","Source-specific parser","Normalised schema"],"options":["Combines supported sources","Defines common field meanings","Transforms a particular source"],"answer":["Combines supported sources","Transforms a particular source","Defines common field meanings"],"why":"ASIM separates source transformation from querying."},{"cat":"KQL","title":"Debug distinct counting","prompt":"Count distinct users per IP.","type":"select","items":["Operator","Function","Grouping field"],"options":[["extend","summarize","project"],["count","dcount","sum"],["UserPrincipalName","IPAddress","ResultType"]],"answer":["summarize","dcount","IPAddress"],"why":"dcount estimates distinct values.","code":"SigninLogs\n| [1] Users=[2](UserPrincipalName) by [3]"},{"cat":"Sentinel configuration","title":"Scheduled detection","prompt":"Follow this workflow: develop logic, enrich, schedule, enable.","type":"order","items":["Enable and monitor rule","Define schedule and threshold","Develop and test KQL","Configure alert details and entities"],"answer":[2,3,1,0],"why":"Develop and test, enrich, schedule and enable. Some settings can be configured in either order."},{"cat":"Defender XDR","title":"Endpoint actions","prompt":"Match response actions.","type":"select","items":["Network containment of confirmed compromised endpoint","Remove confirmed malicious file","Collect current endpoint evidence"],"options":["Isolate device","Stop and quarantine file","Collect investigation package"],"answer":["Isolate device","Stop and quarantine file","Collect investigation package"],"why":"Containment, remediation and evidence collection differ."},{"cat":"KQL","title":"Interpret aggregate results","prompt":"IP A: 12 unique users, 15 failures. IP B: 1 unique user, 50 failures.","type":"select","items":["Likely password spraying pattern","Likely repeated attempts against one user","Does either row prove compromise?"],"options":[["IP A","IP B"],["IP A","IP B"],["Yes","No"]],"answer":["IP A","IP B","No"],"why":"Breadth versus concentration suggests different attack patterns; neither proves compromise."},{"cat":"Sentinel configuration","title":"Ingestion components","prompt":"Match collection requirements.","type":"select","items":["Windows security events via AMA","Linux Syslog via AMA","Control collection and routing for AMA"],"options":["Syslog via AMA connector","Data collection rule","Windows Security Events via AMA connector"],"answer":["Windows Security Events via AMA connector","Syslog via AMA connector","Data collection rule"],"why":"Connectors and DCRs determine collection and routing."},{"cat":"KQL","title":"Correct sorting and limiting","prompt":"Return newest 20 endpoint network events.","type":"select","items":["Sort operator","Direction","Limit operator"],"options":[["sort","extend","join"],["asc","desc"],["take","summarize","distinct"]],"answer":["sort","desc","take"],"why":"Sort before limiting.","code":"DeviceNetworkEvents\n| project Timestamp, DeviceName, RemoteIP\n| [1] by Timestamp [2]\n| [3] 20"},{"cat":"Cross-platform investigation","title":"OAuth consent incident","prompt":"Unfamiliar app receives broad delegated permissions; unusual downloads follow.","type":"select","items":["Review consent changes","Review cloud file activity","Contain confirmed malicious app access"],"options":[["Entra audit logs","DeviceRegistryEvents","Azure billing"],["CloudAppEvents","DeviceInfo","SecurityEvent only"],["Revoke malicious grants and disable app as appropriate","Delete mailbox","Ignore consent"]],"answer":["Entra audit logs","CloudAppEvents","Revoke malicious grants and disable app as appropriate"],"why":"Investigate consent and actual app activity."},{"cat":"Security automation","title":"Missing playbook","prompt":"Follow diagnostic order: existence, compatibility, permission, test.","type":"order","items":["Confirm Sentinel execution permission","Verify and test invocation","Confirm Logic App exists and is enabled","Check trigger compatibility"],"answer":[2,3,0,1],"why":"An enabled compatible workflow and correct permissions are prerequisites."},{"cat":"Incident investigation","title":"Incident classifications","prompt":"Match each outcome to its concept.","type":"select","items":["Confirmed malicious activity","Detection identifies expected authorised activity","Detection incorrectly identifies benign activity as malicious"],"options":["Benign positive","False positive","True positive"],"answer":["True positive","Benign positive","False positive"],"why":"Classification records the conclusion and supports tuning."},{"cat":"KQL","title":"Debug an enrichment join","prompt":"Preserve all sign-ins and enrich using a watchlist whose SearchKey contains UPNs.","type":"select","items":["Join kind","Left-side key","Output operator"],"options":[["inner","leftouter","leftanti"],["IPAddress","UserPrincipalName","TimeGenerated"],["summarize","project","where"]],"answer":["leftouter","UserPrincipalName","project"],"why":"Left outer join retains unmatched sign-ins.","code":"SigninLogs\n| join kind=[1] (_GetWatchlist('Staff') | project UPN=SearchKey, Department) on $left.[2] == $right.UPN\n| [3] TimeGenerated, UserPrincipalName, Department"},{"cat":"Sentinel configuration","title":"Tune noisy detections","prompt":"A scheduled rule repeatedly alerts on authorised maintenance.","type":"select","items":["Exclude verified maintenance","Preserve other detections","Check for blind spots"],"options":[["Add scoped query exclusion","Disable all analytics","Delete logs"],["Keep rule enabled","Disable connectors","Remove all entities"],["Test historical and suspicious events","Assume no impact","Delete incidents"]],"answer":["Add scoped query exclusion","Keep rule enabled","Test historical and suspicious events"],"why":"Tune narrowly and validate coverage."},{"cat":"KQL","title":"Reusable query expression","prompt":"Define a seven-day window and use it in a filter.","type":"select","items":["Declaration","Timespan","Filter"],"options":[["let","extend","project"],["7d","7","7days"],["where","summarize","join"]],"answer":["let","7d","where"],"why":"let binds expressions and ago accepts a timespan.","code":"[1] window = [2];\nSecurityEvent\n| [3] TimeGenerated > ago(window)"},{"cat":"Defender XDR","title":"Automated investigation status","prompt":"Match interface to objective.","type":"select","items":["Review remediation awaiting approval","Inspect completed response actions","Inspect endpoint activity around alert"],"options":["Action center history","Device timeline","Action center pending actions"],"answer":["Action center pending actions","Action center history","Device timeline"],"why":"Pending actions require review; history tracks executed actions."},{"cat":"ASIM and normalisation","title":"Raw versus normalised events","prompt":"Match query approach to requirement.","type":"select","items":["Windows event 4657 in raw logs","Common registry schema across supported sources","Review transformation for a particular source"],"options":["Source-specific parser code","SecurityEvent","ASIM unifying registry parser"],"answer":["SecurityEvent","ASIM unifying registry parser","Source-specific parser code"],"why":"Raw logs preserve source detail; ASIM supports source-independent querying."},{"cat":"Cross-platform investigation","title":"Data exfiltration investigation","prompt":"Follow this scenario's workflow: validate, scope, contain confirmed activity, recover.","type":"order","items":["Verify recovery and review controls","Correlate identity and cloud activity","Validate anomalous download alert","Revoke compromised sessions and restrict malicious access"],"answer":[2,1,3,0],"why":"Evidence-led scoping supports proportionate containment."},{"cat":"KQL","title":"Windows event IDs","prompt":"Match IDs to activity.","type":"select","items":["Successful logon","Failed logon","Process creation","Member added to security-enabled local group"],"options":["4624","4625","4688","4732"],"answer":["4624","4625","4688","4732"],"why":"These IDs identify authentication, process and group membership events."},{"cat":"KQL","title":"Latest record per device","prompt":"Return newest full DeviceInfo record per device.","type":"select","items":["Operator","Function","Group field"],"options":[["project","summarize","extend"],["max","arg_max","count"],["DeviceId","Timestamp","OSPlatform"]],"answer":["summarize","arg_max","DeviceId"],"why":"arg_max returns fields from the row with the latest timestamp.","code":"DeviceInfo\n| [1] [2](Timestamp, *) by [3]"},{"cat":"Security automation","title":"Safe automated containment","prompt":"Choose appropriate design decisions.","type":"select","items":["Restrict triggering to relevant severe incidents","Avoid isolation of critical servers without review","Investigate failed workflow"],"options":[["Use automation rule conditions","Trigger on every alert","Delete rule"],["Require approval or exclude critical assets","Isolate all devices","Ignore asset importance"],["Review Logic App run history","Delete audit logs","Disable connectors"]],"answer":["Use automation rule conditions","Require approval or exclude critical assets","Review Logic App run history"],"why":"Scope automation and inspect execution history."},{"cat":"Cross-platform investigation","title":"Suspicious inbox rule","prompt":"Unexpected forwarding rule follows unfamiliar successful sign-in.","type":"select","items":["Investigate mailbox changes","Investigate authentication","Contain confirmed compromise"],"options":[["Microsoft 365 audit telemetry","DeviceRegistryEvents","Azure billing"],["Entra sign-in logs","DeviceInfo","Firewall rules only"],["Remove malicious rule, revoke sessions and reset credentials","Delete all mail","Disable auditing"]],"answer":["Microsoft 365 audit telemetry","Entra sign-in logs","Remove malicious rule, revoke sessions and reset credentials"],"why":"Correlate mailbox changes with sign-ins and remove persistence."},{"cat":"KQL","title":"Read a KQL pipeline","prompt":"Identify what each stage does.","type":"select","items":["First where","summarize","Final where"],"options":["Counts events per IP","Filters aggregated counts","Limits raw events by time"],"answer":["Limits raw events by time","Counts events per IP","Filters aggregated counts"],"why":"Filter, aggregate, then filter groups.","code":"SigninLogs\n| where TimeGenerated > ago(1h)\n| summarize Total=count() by IPAddress\n| where Total > 20"}];
const app=document.getElementById("app");
const marks=q=>q.marks||q.answer.length;
const total=questions.reduce((s,q)=>s+marks(q),0);
let index=0,mode="practice",name="",answers=[],scores=[],submitted=false,start=0;
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const e=escapeHtml;
const head=()=>'<div class="row brand"><div><strong>Cloud for Me</strong><br><small>Make IT make sense</small></div><a href="https://cloudforme.com" target="_blank" rel="noopener">cloudforme.com</a></div><div class="eyebrow">SC-200 • SECURITY OPERATIONS</div><h1>SOC Skills Challenge</h1>';
const foot=()=>'<footer>Independent formative practice · Not official Microsoft exam questions · KQL is rubric-marked, not executed. Answers and scores remain in your browser.</footer>';
function init(q){return q.type==="order"?q.items.map((_,i)=>i):q.type==="debug"?q.code:q.type==="write"?"":q.answer.map(()=> "");}
function grade(q,a){
if(q.type==="debug"||q.type==="write"){
const t=a.toLowerCase().replace(/\/\/[^\n]*/g,"").replace(/\s+/g," ").trim();
const criteria=q.type==="debug"?[["Valid 24-hour timespan",/ago\s*\(\s*(24h|1d)\s*\)/.test(t)],["Process creation event",/eventid\s*==\s*4688\b/.test(t)],["Correct aggregation",/summarize\s+total\s*=\s*count\s*\(\s*\)\s+by\s+computer/.test(t)]]:[["Correct table",/^deviceprocessevents\b/.test(t)],["24-hour filter",/where\s+timestamp\s*(>|>=)\s*ago\s*\(\s*(24h|1d)\s*\)/.test(t)],["Executable filter",/where\s+filename\s*(==|=~)\s*["']powershell\.exe["']/.test(t)],["Four output fields",["devicename","accountname","timestamp","processcommandline"].every(f=>((/\|\s*project\s+([^|]+)/.exec(t)||["",""])[1].split(",").map(v=>v.trim()).includes(f)))],["Newest first",/(order|sort)\s+by\s+timestamp\s+desc\b/.test(t)]];
return {score:criteria.filter(c=>c[1]).length,criteria};
}return {score:q.answer.filter((v,j)=>a[j]===v).length};}
function landing(){app.innerHTML=head()+'<p class="muted">Applied skills assessment · Version 2 · Four batches of 10</p><div class="grid"><div class="panel"><div class="num">40</div>Challenges</div><div class="panel"><div class="num">'+total+'</div>Available marks</div><div class="panel"><div class="num">20–25</div>Minutes per batch</div><div class="panel"><div class="num">2</div>Assessment modes</div></div><label for="name">Delegate name (optional)</label><input id="name" autocomplete="off" placeholder="Enter your name"><label for="mode">Assessment mode</label><select id="mode"><option value="practice">Practice — immediate feedback</option><option value="exam">Exam — feedback at the end</option></select><button class="primary" id="start">Start assessment →</button>'+foot();document.getElementById("start").onclick=()=>{name=document.getElementById("name").value;mode=document.getElementById("mode").value;answers=questions.map(init);scores=[];index=0;submitted=false;start=Date.now();render()}}
function model(q){return typeof q.answer==="string"?'<pre>'+e(q.answer)+'</pre>':q.type==="order"?q.answer.map((n,j)=>'<div>'+(j+1)+'. '+e(q.items[n])+'</div>').join(""):q.code?'<pre>'+e(q.code.replace(/\[(\d+)\]/g,(_,n)=>q.answer[+n-1]))+'</pre>':q.answer.map((v,j)=>'<div>'+(j+1)+'. '+e(v)+'</div>').join("");}
function feedback(q,r){return '<div class="panel"><h2 class="'+(r.score===marks(q)?"ok":"bad")+'">'+r.score+' / '+marks(q)+' marks</h2>'+(r.criteria?r.criteria.map(c=>'<div class="'+(c[1]?"ok":"bad")+'">'+(c[1]?"✓ ":"○ ")+e(c[0])+'</div>').join(""):"")+'<b>Model answer</b>'+model(q)+'<p>'+e(q.why)+'</p></div>'}
function render(){const q=questions[index],a=answers[index];let h=head()+'<div class="row"><span class="muted">Challenge '+(index+1)+' of '+questions.length+' · '+e(mode)+'</span><b>'+marks(q)+' marks</b></div><div class="bar"><i style="width:'+((index+(submitted?1:0))/questions.length*100)+'%"></i></div><div class="eyebrow">'+e(q.cat)+'</div><h2>'+e(q.title)+'</h2><p>'+e(q.prompt)+'</p>';
if(q.table)h+='<div class="panel" style="overflow:auto"><table><thead><tr><th>Time UTC</th><th>User</th><th>IP</th><th>Result</th></tr></thead><tbody>'+q.table.map(r=>'<tr>'+r.map(v=>'<td>'+e(v)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
if(q.timeline)h+='<div class="panel">'+q.timeline.map(v=>'<p>'+e(v)+'</p>').join("")+'</div>';
if(q.type==="order"){h+='<p class="muted">Drag items or use the arrows to reorder.</p>'+a.map((n,j)=>'<div class="tile" draggable="'+!submitted+'" data-pos="'+j+'"><b>'+(j+1)+'</b><span>'+e(q.items[n])+'</span><button aria-label="Move up" data-move="'+j+',-1" '+(submitted||j===0?"disabled":"")+'>↑</button><button aria-label="Move down" data-move="'+j+',1" '+(submitted||j===a.length-1?"disabled":"")+'>↓</button></div>').join("");}
else if(q.type==="debug"||q.type==="write"){if(q.code)h+='<pre>'+e(q.code)+'</pre>';h+='<label for="query">Your KQL query</label><textarea id="query" spellcheck="false" '+(submitted?"disabled":"")+'>'+e(a)+'</textarea><small>Equivalent syntax may require manual review.</small>';}
else{if(q.code)h+='<pre>'+e(q.code.replace(/\[(\d+)\]/g,(m,n)=>a[+n-1]||m))+'</pre>';h+=q.items.map((v,j)=>'<label for="f'+j+'">'+e(v)+'</label><select id="f'+j+'" data-field="'+j+'" '+(submitted?"disabled":"")+'><option value="">Select an answer</option>'+(Array.isArray(q.options[0])?q.options[j]:q.options).map(o=>'<option value="'+e(o)+'" '+(a[j]===o?"selected":"")+'>'+e(o)+'</option>').join("")+'</select>').join("");}
h+=submitted?(mode==="practice"?feedback(q,scores[index]):'<p class="ok">Answer recorded.</p>')+'<button class="primary" id="next">'+((index+1)%10===0?"Finish batch":"Next challenge →")+'</button>':'<button class="primary" id="submit">Submit answer</button>';app.innerHTML=h+foot();
app.querySelectorAll("[data-field]").forEach(el=>el.onchange=()=>{a[+el.dataset.field]=el.value;if(q.code)render()});
const query=document.getElementById("query");if(query)query.oninput=()=>answers[index]=query.value;
app.querySelectorAll("[data-move]").forEach(el=>el.onclick=()=>{const [j,d]=el.dataset.move.split(",").map(Number);[a[j],a[j+d]]=[a[j+d],a[j]];render()});
let drag=-1;app.querySelectorAll("[data-pos]").forEach(el=>{el.ondragstart=ev=>{if(submitted)return;drag=+el.dataset.pos;ev.dataTransfer.setData("text/plain",String(drag))};el.ondragover=ev=>ev.preventDefault();el.ondrop=ev=>{ev.preventDefault();if(!submitted&&drag>=0){a.splice(+el.dataset.pos,0,a.splice(drag,1)[0]);render()}}});
const sub=document.getElementById("submit");if(sub)sub.onclick=()=>{scores[index]=grade(q,answers[index]);submitted=true;render()};const next=document.getElementById("next");if(next)next.onclick=()=>{if((index+1)%10===0)checkpoint();else{index++;submitted=false;render();window.scrollTo(0,0)}};}
function checkpoint(){const done=scores.length;app.innerHTML=head()+'<div class="panel"><h2>Batch '+Math.ceil(done/10)+' complete</h2><p>'+done+' of '+questions.length+' challenges completed.</p><div class="bar"><i style="width:'+done/questions.length*100+'%"></i></div><p>Continue or review your results so far. Returning to the main page lets you resume this attempt.</p></div>'+(done<questions.length?'<button id="continue" class="primary">Continue to batch '+(Math.floor(done/10)+1)+'</button>':'')+'<button id="results" class="secondary">View results</button><button id="home" class="secondary">Return to main page</button>'+foot();const cont=document.getElementById("continue");if(cont)cont.onclick=resumeBatch;document.getElementById("results").onclick=summary;document.getElementById("home").onclick=home;window.scrollTo(0,0)}
function resumeBatch(){index=scores.length;submitted=false;render();window.scrollTo(0,0)}
function home(){landing();if(!scores.length)return;const box=document.createElement("div");box.className="panel";box.innerHTML='<p>Previous attempt: '+scores.length+' of '+questions.length+' challenges completed.</p><button id="oldresults" class="secondary">View previous results</button>'+(scores.length<questions.length?'<button id="oldresume" class="secondary">Resume next batch</button>':'');app.insertBefore(box,app.querySelector("footer"));document.getElementById("oldresults").onclick=summary;const resume=document.getElementById("oldresume");if(resume)resume.onclick=resumeBatch;const startButton=document.getElementById("start"),old=startButton.onclick;startButton.textContent="Start new assessment";startButton.onclick=()=>{if(confirm("Start a new attempt and discard previous results?"))old()};}
function summary(){const completed=questions.slice(0,scores.length),possible=completed.reduce((sum,q)=>sum+marks(q),0),score=scores.reduce((sum,r)=>sum+r.score,0),pct=Math.round(score/possible*100),cats={};completed.forEach((q,j)=>{const c=cats[q.cat]||(cats[q.cat]=[0,0]);c[0]+=scores[j].score;c[1]+=marks(q)});app.innerHTML=head()+'<p class="muted">Results '+(name?'· '+e(name):"")+'</p><div class="panel"><div class="score">'+pct+'%</div><b>'+score+' / '+possible+' marks</b><p>'+completed.length+' of '+questions.length+' challenges completed · '+Math.max(1,Math.round((Date.now()-start)/60000))+' minutes elapsed</p></div><h2>Performance by topic</h2>'+Object.entries(cats).map(([k,v])=>'<div class="row"><span>'+e(k)+'</span><b>'+v[0]+'/'+v[1]+'</b></div><div class="bar"><i style="width:'+(v[0]/v[1]*100)+'%"></i></div>').join("")+'<h2>Review your answers</h2>'+completed.map((q,j)=>'<details class="panel"><summary>'+(j+1)+'. '+e(q.title)+' — '+scores[j].score+'/'+marks(q)+'</summary><p><b>Your answer</b></p><pre>'+e(q.type==="order"?answers[j].map(n=>q.items[n]).join("\n"):Array.isArray(answers[j])?answers[j].map((x,n)=>(n+1)+". "+(x||"Not answered")).join("\n"):answers[j]||"Not answered")+'</pre>'+feedback(q,scores[j])+'</details>').join("")+'<button class="primary" id="download">Download results (CSV)</button>'+(completed.length<questions.length?'<button class="secondary" id="resume">Continue next batch</button>':'')+'<button class="secondary" id="restart">Return to main page</button>'+foot();document.getElementById("restart").onclick=home;const resume=document.getElementById("resume");if(resume)resume.onclick=resumeBatch;document.getElementById("download").onclick=()=>{const rows=[["Delegate","Mode","Completed","Overall marks","Available marks","Percentage","Batch","Question","Topic","Challenge","Marks awarded","Maximum marks"],...completed.map((q,j)=>[name||"Anonymous",mode,completed.length,score,possible,pct,Math.floor(j/10)+1,j+1,q.cat,q.title,scores[j].score,marks(q)])];const csv=rows.map(row=>row.map(v=>{let str=String(v);if(/^[\s]*[=+\-@\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'}).join(",")).join("\r\n");const url=URL.createObjectURL(new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"}));const link=document.createElement("a");link.href=url;link.download="sc200-results.csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.scrollTo(0,0)}
landing();
</script></body></html>
