<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC-200 | SOC Skills Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1525;color:#e8edf7;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:32px auto;padding:24px}h1{font-size:32px;line-height:1.15;margin:8px 0}h2{font-size:23px;line-height:1.3}.eyebrow{color:#81c7ff;font-size:12px;letter-spacing:2px;font-weight:bold}.muted,small{color:#a5b4ca}.panel{background:#162238;border:1px solid #30425d;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .panel{margin:0}.num{font-size:26px;font-weight:bold}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.bar{height:9px;border-radius:10px;background:#2b3d54;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#56adff}label{display:block;margin:15px 0 5px}input,select,textarea,button{font:inherit;color:inherit;border:1px solid #48617d;border-radius:7px;padding:10px;background:#101b2d}input,select,textarea{width:100%}textarea{min-height:180px;font-family:monospace}button{cursor:pointer;background:#20344d}button:hover{background:#315576}button:disabled{opacity:.4;cursor:default}.primary{background:#1968be;font-weight:bold;width:100%;margin-top:18px}.tile{display:flex;align-items:center;gap:10px;border:1px solid #435673;background:#19283e;padding:10px;border-radius:8px;margin:8px 0}.tile span{flex:1}.tile button{padding:4px 12px}pre{background:#080f1c;padding:15px;border-radius:8px;color:#b5d9ff;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #34445a}.ok{color:#65d6ab}.bad{color:#f7b77c}.score{font-size:44px;color:#81c7ff;font-weight:bold}footer{margin-top:24px;color:#a5b4ca;font-size:12px}summary{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #81c7ff;outline-offset:2px}@media(max-width:500px){main{margin:0;padding:16px}.tile{gap:5px}.tile button{padding:4px 8px}h1{font-size:26px}}
</style></head><body><main id="app"></main><script>
"use strict";
const questions=[{"cat":"Security automation","title":"Configure an automated response","prompt":"Arrange the steps for deploying and validating a new incident-triggered Sentinel playbook.","type":"order","items":["Configure an automation rule to invoke the playbook","Create the Logic App with the Sentinel incident trigger","Generate a test incident and verify execution","Grant Sentinel permission to execute the playbook"],"answer":[1,3,0,2],"why":"Create the Logic App, grant execution permissions, link it to an automation rule, then test."},{"cat":"KQL","title":"Detect repeated failed sign-ins","prompt":"Find users with more than 10 unsuccessful sign-ins in the last hour.","type":"select","code":"SigninLogs\n| [1] TimeGenerated > ago(1h)\n| where [2] != \"0\"\n| [3] Failures = count() by UserPrincipalName\n| where Failures [4] 10","items":["Blank 1","Blank 2","Blank 3","Blank 4"],"options":[["where","project","extend","join"],["IPAddress","UserPrincipalName","ResultType","Location"],["extend","summarize","distinct","project"],[">=","\u003c","==",">"]],"answer":["where","ResultType","summarize",">"],"why":"Filter by time and result before aggregating; apply the threshold afterwards. Non-zero result codes may include interrupted sign-ins."},{"cat":"Defender XDR","title":"Choose the right security capability","prompt":"Match each requirement to a product.","type":"select","items":["Correlate third-party firewall logs","Investigate endpoint process execution","Detect suspicious on-premises Active Directory activity","Investigate malicious email attachments","Investigate suspicious OAuth application activity"],"options":["Defender for Identity","Defender for Cloud Apps","Microsoft Sentinel","Defender for Office 365","Defender for Endpoint"],"answer":["Microsoft Sentinel","Defender for Endpoint","Defender for Identity","Defender for Office 365","Defender for Cloud Apps"],"why":"Sentinel correlates data across sources; Defender products specialise in endpoint, identity, email and cloud application security."},{"cat":"KQL","title":"Debug the detection query","prompt":"Correct three errors to identify computers generating more than five process creation events in 24 hours.","type":"debug","code":"SecurityEvent\n| where TimeGenerated > ago(24)\n| where EventID == 4624\n| project Total = count() by Computer\n| where Total > 5","answer":"SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID == 4688\n| summarize Total = count() by Computer\n| where Total > 5","marks":3,"why":"Use a valid timespan, event 4688 and summarize for aggregation."},{"cat":"Incident investigation","title":"Investigate suspicious authentication","prompt":"Interpret this fictional sign-in evidence.","type":"select","table":[["09:01","Alice","203.0.113.10","Failed"],["09:02","Bob","203.0.113.10","Failed"],["09:03","Charlie","203.0.113.10","Failed"],["09:04","David","203.0.113.10","Failed"],["09:05","Alice","203.0.113.10","Failed"],["09:06","Bob","203.0.113.10","Success"]],"items":["Likely attack pattern","Account to prioritise","Evidence needed next","If compromise is confirmed"],"options":[["Password spraying","Ransomware","Data destruction"],["Alice","Bob","Charlie","David"],["Sign-in context and subsequent activity","Storage account configuration","Retention label inventory"],["Revoke sessions and reset credentials","Delete audit logs","Ignore the successful sign-in"]],"answer":["Password spraying","Bob","Sign-in context and subsequent activity","Revoke sessions and reset credentials"],"why":"Multiple accounts share a suspicious source IP and one subsequently authenticates. Investigate Bob, but the pattern alone is not proof of compromise."},{"cat":"KQL","title":"Construct an advanced hunting query","prompt":"Using DeviceProcessEvents, find powershell.exe executions in the last 24 hours. Return DeviceName, AccountName, Timestamp and ProcessCommandLine, newest first.","type":"write","answer":"DeviceProcessEvents\n| where Timestamp > ago(24h)\n| where FileName =~ \"powershell.exe\"\n| project DeviceName, AccountName, Timestamp, ProcessCommandLine\n| order by Timestamp desc","marks":5,"why":"Process telemetry provides execution context. PowerShell is not inherently malicious."},{"cat":"Incident investigation","title":"Respond to confirmed endpoint compromise","prompt":"Arrange the activities according to this SOC procedure: validation, containment, remediation, verified recovery.","type":"order","items":["Verify the device is clean and release isolation","Remove malicious files and remediate persistence","Validate the alert and confirm the affected device","Isolate the compromised device"],"answer":[2,3,1,0],"why":"Validate, contain, eradicate and recover. Real incidents may have overlapping actions and require evidence preservation."},{"cat":"Sentinel configuration","title":"Configure Microsoft Sentinel","prompt":"Match requirements to Sentinel capabilities.","type":"select","items":["Import supported event data","Turn matching KQL results into alerts","Automatically invoke a response workflow","Associate query results with a host or account"],"options":["Entity mapping","Analytics rule","Automation rule","Data connector"],"answer":["Data connector","Analytics rule","Automation rule","Entity mapping"],"why":"Connectors ingest, analytics rules detect, automation rules orchestrate and entity mapping adds context."},{"cat":"ASIM and normalisation","title":"Hunt across normalised sources","prompt":"Complete a query using the available built-in registry parser to retrieve up to 100 events from the last day.","type":"select","code":"[1]()\n| [2] TimeGenerated > ago(1d)\n| [3] 100","items":["Blank 1","Blank 2","Blank 3"],"options":[["SecurityEvent","_Im_RegistryEvent","DeviceInfo"],["extend","project","where"],["count","take","join"]],"answer":["_Im_RegistryEvent","where","take"],"why":"The unifying ASIM parser exposes a common registry event schema across supported sources."},{"cat":"Cross-platform investigation","title":"SOC simulation: Compromised employee","prompt":"Review Contoso’s fictional incident timeline and select an evidence-led response.","type":"select","timeline":["08:45 — Phishing email delivered to Sarah.","09:02 — Successful sign-in from unfamiliar location.","09:15 — Unusual volume of cloud file downloads.","09:22 — Suspicious PowerShell activity on her laptop."],"items":["Verify authentication activity","Retrieve endpoint process evidence","Contain confirmed endpoint compromise","Reduce risk from stolen active sessions","Automate disruptive actions responsibly"],"options":[["Entra ID SigninLogs","Sensitivity label policy","Azure billing logs"],["DeviceProcessEvents","EmailEvents only","Azure resource tags"],["Isolate the device","Delete the incident","Disable logging"],["Revoke active sessions","Change incident title","Create a workbook"],["Use scoped playbook with approval where appropriate","Wipe every device automatically","Disable detection rules"]],"answer":["Entra ID SigninLogs","DeviceProcessEvents","Isolate the device","Revoke active sessions","Use scoped playbook with approval where appropriate"],"why":"Correlate identity, email, cloud and endpoint signals. Scope response and use approval where necessary."}];
const app=document.getElementById("app");
const marks=q=>q.marks||q.answer.length;
const total=questions.reduce((s,q)=>s+marks(q),0);
let index=0,mode="practice",name="",answers=[],scores=[],submitted=false,start=0;
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const e=escapeHtml;
const head=()=>'<div class="eyebrow">SC-200 • SECURITY OPERATIONS</div><h1>SOC Skills Challenge</h1>';
const foot=()=>'<footer>Independent formative practice · Not official Microsoft exam questions · KQL is rubric-marked, not executed. Answers and scores remain in your browser.</footer>';
function init(q){return q.type==="order"?q.items.map((_,i)=>i):q.type==="debug"?q.code:q.type==="write"?"":q.answer.map(()=> "");}
function grade(q,a){
if(q.type==="debug"||q.type==="write"){
const t=a.toLowerCase().replace(/\/\/[^\n]*/g,"").replace(/\s+/g," ").trim();
const criteria=q.type==="debug"?[["Valid 24-hour timespan",/ago\s*\(\s*(24h|1d)\s*\)/.test(t)],["Process creation event",/eventid\s*==\s*4688\b/.test(t)],["Correct aggregation",/summarize\s+total\s*=\s*count\s*\(\s*\)\s+by\s+computer/.test(t)]]:[["Correct table",/^deviceprocessevents\b/.test(t)],["24-hour filter",/where\s+timestamp\s*(>|>=)\s*ago\s*\(\s*(24h|1d)\s*\)/.test(t)],["Executable filter",/where\s+filename\s*(==|=~)\s*["']powershell\.exe["']/.test(t)],["Four output fields",["devicename","accountname","timestamp","processcommandline"].every(f=>((/\|\s*project\s+([^|]+)/.exec(t)||["",""])[1].split(",").map(v=>v.trim()).includes(f)))],["Newest first",/(order|sort)\s+by\s+timestamp\s+desc\b/.test(t)]];
return {score:criteria.filter(c=>c[1]).length,criteria};
}return {score:q.answer.filter((v,j)=>a[j]===v).length};}
function landing(){app.innerHTML=head()+'<p class="muted">Applied skills assessment · Prototype 01</p><div class="grid"><div class="panel"><div class="num">10</div>Challenges</div><div class="panel"><div class="num">'+total+'</div>Available marks</div><div class="panel"><div class="num">20–25</div>Suggested minutes</div><div class="panel"><div class="num">2</div>Assessment modes</div></div><label for="name">Delegate name (optional)</label><input id="name" autocomplete="off" placeholder="Enter your name"><label for="mode">Assessment mode</label><select id="mode"><option value="practice">Practice — immediate feedback</option><option value="exam">Exam — feedback at the end</option></select><button class="primary" id="start">Start assessment →</button>'+foot();document.getElementById("start").onclick=()=>{name=document.getElementById("name").value;mode=document.getElementById("mode").value;answers=questions.map(init);scores=[];index=0;submitted=false;start=Date.now();render()}}
function model(q){return typeof q.answer==="string"?'<pre>'+e(q.answer)+'</pre>':q.type==="order"?q.answer.map((n,j)=>'<div>'+(j+1)+'. '+e(q.items[n])+'</div>').join(""):q.code?'<pre>'+e(q.code.replace(/\[(\d+)\]/g,(_,n)=>q.answer[+n-1]))+'</pre>':q.answer.map((v,j)=>'<div>'+(j+1)+'. '+e(v)+'</div>').join("");}
function feedback(q,r){return '<div class="panel"><h2 class="'+(r.score===marks(q)?"ok":"bad")+'">'+r.score+' / '+marks(q)+' marks</h2>'+(r.criteria?r.criteria.map(c=>'<div class="'+(c[1]?"ok":"bad")+'">'+(c[1]?"✓ ":"○ ")+e(c[0])+'</div>').join(""):"")+'<b>Model answer</b>'+model(q)+'<p>'+e(q.why)+'</p></div>'}
function render(){const q=questions[index],a=answers[index];let h=head()+'<div class="row"><span class="muted">Challenge '+(index+1)+' of '+questions.length+' · '+e(mode)+'</span><b>'+marks(q)+' marks</b></div><div class="bar"><i style="width:'+((index+(submitted?1:0))/questions.length*100)+'%"></i></div><div class="eyebrow">'+e(q.cat)+'</div><h2>'+e(q.title)+'</h2><p>'+e(q.prompt)+'</p>';
if(q.table)h+='<div class="panel" style="overflow:auto"><table><thead><tr><th>Time UTC</th><th>User</th><th>IP</th><th>Result</th></tr></thead><tbody>'+q.table.map(r=>'<tr>'+r.map(v=>'<td>'+e(v)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
if(q.timeline)h+='<div class="panel">'+q.timeline.map(v=>'<p>'+e(v)+'</p>').join("")+'</div>';
if(q.type==="order"){h+='<p class="muted">Drag items or use the arrows to reorder.</p>'+a.map((n,j)=>'<div class="tile" draggable="'+!submitted+'" data-pos="'+j+'"><b>'+(j+1)+'</b><span>'+e(q.items[n])+'</span><button aria-label="Move up" data-move="'+j+',-1" '+(submitted||j===0?"disabled":"")+'>↑</button><button aria-label="Move down" data-move="'+j+',1" '+(submitted||j===a.length-1?"disabled":"")+'>↓</button></div>').join("");}
else if(q.type==="debug"||q.type==="write"){if(q.code)h+='<pre>'+e(q.code)+'</pre>';h+='<label for="query">Your KQL query</label><textarea id="query" spellcheck="false" '+(submitted?"disabled":"")+'>'+e(a)+'</textarea><small>Equivalent syntax may require manual review.</small>';}
else{if(q.code)h+='<pre>'+e(q.code.replace(/\[(\d+)\]/g,(m,n)=>a[+n-1]||m))+'</pre>';h+=q.items.map((v,j)=>'<label for="f'+j+'">'+e(v)+'</label><select id="f'+j+'" data-field="'+j+'" '+(submitted?"disabled":"")+'><option value="">Select an answer</option>'+(Array.isArray(q.options[0])?q.options[j]:q.options).map(o=>'<option value="'+e(o)+'" '+(a[j]===o?"selected":"")+'>'+e(o)+'</option>').join("")+'</select>').join("");}
h+=submitted?(mode==="practice"?feedback(q,scores[index]):'<p class="ok">Answer recorded.</p>')+'<button class="primary" id="next">'+(index===questions.length-1?"View results":"Next challenge →")+'</button>':'<button class="primary" id="submit">Submit answer</button>';app.innerHTML=h+foot();
app.querySelectorAll("[data-field]").forEach(el=>el.onchange=()=>{a[+el.dataset.field]=el.value;if(q.code)render()});
const query=document.getElementById("query");if(query)query.oninput=()=>answers[index]=query.value;
app.querySelectorAll("[data-move]").forEach(el=>el.onclick=()=>{const [j,d]=el.dataset.move.split(",").map(Number);[a[j],a[j+d]]=[a[j+d],a[j]];render()});
let drag=-1;app.querySelectorAll("[data-pos]").forEach(el=>{el.ondragstart=ev=>{if(submitted)return;drag=+el.dataset.pos;ev.dataTransfer.setData("text/plain",String(drag))};el.ondragover=ev=>ev.preventDefault();el.ondrop=ev=>{ev.preventDefault();if(!submitted&&drag>=0){a.splice(+el.dataset.pos,0,a.splice(drag,1)[0]);render()}}});
const sub=document.getElementById("submit");if(sub)sub.onclick=()=>{scores[index]=grade(q,answers[index]);submitted=true;render()};const next=document.getElementById("next");if(next)next.onclick=()=>{if(index===questions.length-1)summary();else{index++;submitted=false;render();window.scrollTo(0,0)}};}
function summary(){const score=scores.reduce((s,r)=>s+r.score,0),pct=Math.round(score/total*100),cats={};questions.forEach((q,j)=>{const c=cats[q.cat]||(cats[q.cat]=[0,0]);c[0]+=scores[j].score;c[1]+=marks(q)});app.innerHTML=head()+'<p class="muted">Assessment complete '+(name?'· '+e(name):"")+'</p><div class="panel"><div class="score">'+pct+'%</div><b>'+score+' / '+total+' marks</b><p>'+Math.max(1,Math.round((Date.now()-start)/60000))+' minutes elapsed</p></div><h2>Performance by topic</h2>'+Object.entries(cats).map(([k,v])=>'<div class="row"><span>'+e(k)+'</span><b>'+v[0]+'/'+v[1]+'</b></div><div class="bar"><i style="width:'+(v[0]/v[1]*100)+'%"></i></div>').join("")+'<h2>Review your answers</h2>'+questions.map((q,j)=>'<details class="panel"><summary>'+ (j+1)+'. '+e(q.title)+' — '+scores[j].score+'/'+marks(q)+'</summary><p><b>Your answer</b></p><pre>'+e(q.type==="order"?answers[j].map(n=>q.items[n]).join("\n"):Array.isArray(answers[j])?answers[j].map((x,n)=>(n+1)+". "+(x||"Not answered")).join("\n"):answers[j]||"Not answered")+'</pre>'+feedback(q,scores[j])+'</details>').join("")+'<button class="primary" id="download">Download results</button><button class="primary" id="restart">Retake assessment</button>'+foot();document.getElementById("restart").onclick=landing;document.getElementById("download").onclick=()=>{const report={delegate:name||"Anonymous",score,total,percentage:pct,topics:cats,questions:questions.map((q,j)=>({title:q.title,score:scores[j].score,marks:marks(q)}))};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="sc200-results.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};}
landing();
</script></body></html>
